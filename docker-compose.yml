services:
  db:
    image: postgres:18
    container_name: inventory-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: inventory
      TZ: Europe/Rome
    volumes:
      - /home/napalmz/docker-conf/home-inventory/pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d inventory"]
      interval: 5s
      retries: 5
    restart: always

  backend:
    image: napalmzrpi/home-inventory-backend:latest
    container_name: inventory-backend
    environment:
      TZ: Europe/Rome
      DATABASE_URL: postgresql://admin:admin@db:5432/inventory
      POSTGRES_HOST: db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: inventory
      FASTAPI_ROOT_PATH: /api
      GOOGLE_BOOKS_API_KEY: your_api_key_here
      # Dibilita la ricerca di codici a barre tramite API esterne
      # BARCODE_LOOKUP_ENABLED: "false"
      # Telemetria anonima opt-in (vedi README): decommenta per attivarla
      # TELEMETRY_ENABLED: "true"
    volumes:
      - /home/napalmz/docker-conf/home-inventory/backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
    restart: always

  frontend:
    image: napalmzrpi/home-inventory-frontend:latest
    container_name: inventory-frontend
    environment:
      TZ: Europe/Rome
      BACKEND_BASE_URL: http://backend:8000
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always