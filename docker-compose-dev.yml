x-common-environment: &common-environment
  TZ: ${TZ:-Europe/Rome}

services:
  postgres:
    image: postgres:18
    container_name: inventory-db
    profiles: ["postgres"]
    restart: always
    environment:
      <<: *common-environment
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-inventory}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      retries: 5

  mysql:
    image: mariadb:11
    container_name: inventory-mysql
    profiles: ["mysql"]
    restart: always
    environment:
      <<: *common-environment
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-admin}
      MARIADB_USER: ${MYSQL_USER:-admin}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:-admin}
      MARIADB_DATABASE: ${MYSQL_DATABASE:-inventory}
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: inventory-backend
    restart: always
    healthcheck:
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 3
    environment:
      <<: *common-environment
      DATABASE_TYPE: ${DATABASE_TYPE:-SQLITE}
      DATABASE_URL: ${DATABASE_URL:-}
      FASTAPI_ROOT_PATH: /api
      GOOGLE_BOOKS_API_KEY: your_api_key_here
      # Disabilita la ricerca di codici a barre tramite API esterne
      # BARCODE_LOOKUP_ENABLED: "false"
      # Telemetria anonima opt-in (vedi README): decommenta per attivarla
      # TELEMETRY_ENABLED: "true"
    #ports:
    #  - "8001:8000"
    env_file:
      - backend/.env
    volumes:
      - ./backend:/app

  notification-worker:
    build: ./backend
    profiles: ["notifications"]
    entrypoint: ["python", "-m", "notification_worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "notification_worker", "--healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    environment:
      <<: *common-environment
      DATABASE_TYPE: ${DATABASE_TYPE:-SQLITE}
      DATABASE_URL: ${DATABASE_URL:-}
    env_file:
      - backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: inventory-frontend
    restart: always
    environment:
      <<: *common-environment
      BACKEND_BASE_URL: http://backend:8000
      APP_ENV_LABEL: LOCAL
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  mysqldata:
